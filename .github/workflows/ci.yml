name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, self check and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs the economy, session and loot rules without a device. These are the
      # numbers that make the reward loop feel fair, so they are worth guarding.
      - name: Game logic self check
        run: npm run selfcheck

      # Bundling catches missing imports and broken assets on Linux, which is
      # much faster feedback than a native build.
      - name: Bundle the iOS JavaScript
        run: npx expo export --platform ios --output-dir dist

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: evoabc-ios-bundle
          path: dist
          if-no-files-found: warn
          retention-days: 7
