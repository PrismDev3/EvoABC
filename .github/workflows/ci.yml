name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, self check and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs the economy, session and loot rules without a device. These are the
      # numbers that make the reward loop feel fair, so they are worth guarding.
      - name: Game logic self check
        run: npm run selfcheck

      # Pictures are vector icons, never emoji, and no UI copy carries a long
      # dash. Both are easy to break by accident when adding a word.
      - name: Audit for emoji and long dashes
        run: npm run audit

      # Rebuilds the sounds from the generator, which is seeded and therefore
      # reproducible, so the committed WAVs must match it byte for byte.
      - name: Rebuild the generated sounds
        run: node scripts/generate-audio.js

      - name: Check the committed sounds are up to date
        run: git diff --exit-code -- assets/audio

      # Then measures them: clipping, DC offset, clicks between samples and a
      # buzzy top end all fail the build.
      - name: Measure the generated sounds
        run: npm run audio:check

      # Bundling catches missing imports and broken assets on Linux, which is
      # much faster feedback than a native build.
      - name: Bundle the iOS JavaScript
        run: npx expo export --platform ios --output-dir dist

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: evoabc-ios-bundle
          path: dist
          if-no-files-found: warn
          retention-days: 7
